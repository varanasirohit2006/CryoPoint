name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.data/browsers
      JIT_RUN_BROWSER_TESTS: "1"
      JIT_EMBEDDING_BACKEND: lexical
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --frozen --extra dev
      - run: uv run playwright install --with-deps chromium
      - run: uv run ruff check backend chaos_testbed benchmarks scripts
      - run: uv run pytest --basetemp .data/tests-ci
      - run: npm ci
      - run: npm run check
