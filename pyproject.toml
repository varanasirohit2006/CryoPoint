[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jit-ui-agent"
version = "0.1.0"
description = "A browser workflow compiler with deterministic replay and scoped visual repair"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "playwright>=1.50,<2",
  "jinja2>=3.1,<4",
  "httpx>=0.28,<1",
  "google-genai>=1.50,<4",
  "pillow>=11,<13",
]

[project.optional-dependencies]
semantic = ["chromadb>=1.0,<2", "onnxruntime>=1.20,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[project.scripts]
jit-ui = "jit_ui.api.main:serve"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.setuptools.package-data]
jit_ui = ["browser/*.js"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "chaos_testbed/tests", "benchmarks/tests"]
pythonpath = ["backend/src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv]
package = true
